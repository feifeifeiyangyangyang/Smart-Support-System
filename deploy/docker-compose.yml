services:
  mysql:
    image: mysql:8.4
    container_name: smart-customer-service-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_customer_service}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: smart-customer-service-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_customer_service}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-deepseek-v4-flash}
      DOCUMENT_STORAGE_PATH: /app/data/documents
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - qdrant

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    ports:
      - "8088:80"
    depends_on:
      - server

volumes:
  mysql-data:
  qdrant-data:
